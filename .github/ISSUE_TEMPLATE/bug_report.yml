name: Bug report
description: Report a reproducible problem in Nexus Launcher.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, account tokens, email addresses, private paths, or unredacted logs. Use the private security report action for suspected vulnerabilities.
  - type: input
    id: launcher-version
    attributes:
      label: Nexus Launcher version
      placeholder: 2.2.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: 1.21.1, or Not applicable
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader and version
      placeholder: Fabric 0.20.1, Vanilla, or Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove personal information and credentials before attaching files.
    validations:
      required: false
